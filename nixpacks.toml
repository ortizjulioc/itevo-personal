[variables]
PORT = "3002"

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
# ESTRATEGIA:
# 1. Usamos --ignore-scripts para neutralizar por completo el bloqueo de Prisma.
# 2. Reconstruimos exclusivamente 'bcrypt' para compilar sus binarios nativos de forma aislada.
# 3. Volcamos tus variables al entorno físico .env.
cmds = [
  "npm install --legacy-peer-deps --ignore-scripts",
  "npm rebuild bcrypt",
  "echo \"DATABASE_URL=${DATABASE_URL}\" > .env",
  "echo \"NEXTAUTH_URL=${NEXTAUTH_URL}\" >> .env",
  "echo \"NEXTAUTH_SECRET=${NEXTAUTH_SECRET}\" >> .env",
  "echo \"PORT=${PORT}\" >> .env",
  "echo \"NEXTAUTH_COOKIE_NAME=${NEXTAUTH_COOKIE_NAME}\" >> .env"
]

[phases.build]
# Generamos manualmente el cliente de Prisma y ejecutamos la compilación de Next.js
cmds = ["npx prisma generate", "npm run build"]

[start]
cmd = "npx next start -H 0.0.0.0 -p 3002"

[variables]
PORT = "3002"
# SOLUCIÓN MAESTRA: Forzamos a Nixpacks a descargar una compilación que Prisma acepta obligatoriamente
NIXPACKS_NODE_VERSION = "22.12.0"

[phases.install]
# Volvemos a una instalación limpia SIN '--ignore-scripts' para que el árbol de dependencias sea idéntico a tu local
cmds = [
  "npm install --legacy-peer-deps",
  "echo \"DATABASE_URL=${DATABASE_URL}\" > .env",
  "echo \"NEXTAUTH_URL=${NEXTAUTH_URL}\" >> .env",
  "echo \"NEXTAUTH_SECRET=${NEXTAUTH_SECRET}\" >> .env",
  "echo \"PORT=${PORT}\" >> .env",
  "echo \"NEXTAUTH_COOKIE_NAME=${NEXTAUTH_COOKIE_NAME}\" >> .env"
]

[phases.build]
cmds = ["npx prisma generate", "npm run build"]

[start]
cmd = "npx next start -H 0.0.0.0 -p 3002"
